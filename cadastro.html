       <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
       apiKey: "AIzaSyCniiIW7y6XxgBVy5-MOKnvf985snjRlrg",
  authDomain: "projeto3c-642f9.firebaseapp.com",
  projectId: "projeto3c-642f9",
  storageBucket: "projeto3c-642f9.firebasestorage.app",

  appId: "1:962305450865:web:dbca7ffd956f2682bb0cd0",
  measurementId: "G-WSKV7F27WC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formulario");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const Nome = document.getElementById("nome").value;
      const CEP = document.getElementById("cep").value;
      const CPF = document.getElementById("cpf").value;
      const Data_nascimento = document.getElementById("data_nascimento").value;
      const Email = document.getElementById("email").value;
      const Foto = document.getElementById("foto").value;
      const Idade = document.getElementById("idade").value;
      const RG = document.getElementById("rg").value;
      const Senha = document.getElementById("senha").value;
      const Telefone = document.getElementById("telefone").value;

      try {
        await addDoc(collection(db, "usuarios"), {
          Nome,
          CEP,
          CPF,
          Data_nascimento,
          Email,
          Foto,
          Idade,
          RG,
          Senha,
          Telefone
        });

        mensagem.textContent = "Usuário salvo com sucesso.";
        mensagem.style.color = "green";
        form.reset();
      } catch (error) {
        mensagem.textContent = "Erro ao salvar: " + error.message;
        mensagem.style.color = "red";
      }
    });
  </script>
